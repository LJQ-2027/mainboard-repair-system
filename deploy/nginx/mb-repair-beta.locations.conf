location = /mb-repair-beta {
    return 301 /mb-repair-beta/;
}

location /mb-repair-beta/api/v1/visual-qc/ {
    auth_basic "Mainboard Repair Pilot";
    auth_basic_user_file /etc/nginx/.htpasswd-mb-repair-beta;

    client_max_body_size 20m;
    proxy_pass http://127.0.0.1:3020/api/v1/visual-qc/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Actor-Id $remote_user;
    proxy_set_header X-Actor-Role $mb_repair_actor_role;
    proxy_set_header Authorization "";
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_request_buffering off;
    proxy_buffering off;
}

location /mb-repair-beta/ {
    auth_basic "Mainboard Repair Pilot";
    auth_basic_user_file /etc/nginx/.htpasswd-mb-repair-beta;

    proxy_pass http://127.0.0.1:3010/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_buffering off;
}
