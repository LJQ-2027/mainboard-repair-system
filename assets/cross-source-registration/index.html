<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KM4/F151 跨资料主板工作台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./point-map.css">
  <link rel="stylesheet" href="./schematic-evidence.css">
</head>
<body>
  <header class="topbar">
    <div><span class="eyebrow">KNOWN BOARD / SOURCE-LINKED</span><h1>KM4 · F151_MAIN_PCB_V1.2</h1></div>
    <div class="status"><i></i>维修级 2.5D V2</div>
  </header>
  <main>
    <section class="workspace" aria-label="同步主板视图">
      <div class="view-head">
        <div class="tabs" role="tablist">
          <button role="tab" aria-selected="true" data-view="photo">实体代理图</button>
          <button role="tab" aria-selected="false" data-view="pointmap">点位图</button>
          <button role="tab" aria-selected="false" data-view="model">2.5D 模型</button>
        </div>
        <div class="view-tools" id="pointMapTools" hidden>
          <button class="icon-button" id="zoomOutPointMap" title="缩小点位图" aria-label="缩小点位图">−</button>
          <button class="icon-button" id="zoomInPointMap" title="放大点位图" aria-label="放大点位图">+</button>
          <button class="icon-button" id="resetPointMap" title="重置点位图" aria-label="重置点位图">↻</button>
        </div>
        <div class="view-tools" id="modelTools" hidden>
          <button class="icon-button" id="toggleInspection" type="button" aria-pressed="false" title="切换检视角度" aria-label="切换检视角度">◩</button>
          <button class="icon-button" id="resetModel" type="button" title="显示全板并恢复俯视" aria-label="显示全板">⌖</button>
        </div>
      </div>
      <div class="stage">
        <div class="view active" id="photoView"><div class="image-layer"><img alt="KM4装机主板代理图"><div class="markers"></div></div></div>
        <div class="view point-map-view" id="pointmapView"><div class="image-layer point-map"><img alt="KM4 F151主板点位图"><div class="markers"></div></div></div>
        <div class="view model-view" id="modelView">
          <div id="modelCanvas"></div>
          <div class="anatomy-panel" aria-label="模型解剖层控制">
            <div class="anatomy-segments" role="group" aria-label="屏蔽罩状态">
              <button type="button" data-shield-mode="installed" aria-pressed="false" title="显示安装状态的屏蔽罩">罩上</button>
              <button type="button" data-shield-mode="xray" aria-pressed="false" title="半透明查看屏蔽罩下器件">透视</button>
              <button type="button" data-shield-mode="removed" aria-pressed="true" title="移除屏蔽罩查看器件">拆罩</button>
            </div>
            <select id="moduleFocus" aria-label="选择功能模块">
              <option value="auto">跟随选择</option>
              <option value="none">不显示模块</option>
            </select>
          </div>
          <div class="model-legend" aria-label="模型几何置信度">
            <span><i class="legend-body"></i>可信实体</span>
            <span><i class="legend-outline"></i>参考轮廓</span>
            <span><i class="legend-selected"></i>当前定位</span>
          </div>
        </div>
      </div>
      <div class="source-note" id="sourceNote"></div>
    </section>
    <aside class="evidence">
      <div class="entity-heading"><div><span id="entityCategory"></span><h2 id="entityDesignator">—</h2></div><span class="visibility" id="entityVisibility"></span></div>
      <p class="entity-name" id="entityName"></p>
      <dl class="facts"><div><dt>功能模块</dt><dd id="entityModule"></dd></div><div><dt>统一坐标</dt><dd id="entityCoordinate"></dd></div></dl>
      <section><h3>原理图关系</h3><div id="schematicEvidence"></div></section>
      <section><h3>维修指导</h3><div id="repairEvidence"></div></section>
      <section class="entity-list-section"><h3>本面已关联实体</h3><div class="entity-list" id="entityList"></div></section>
    </aside>
  </main>
  <dialog class="evidence-dialog" id="evidenceDialog" aria-label="原理图局部证据">
    <button class="dialog-close" type="button" aria-label="关闭原理图预览">×</button>
    <img alt="原理图局部证据">
    <p></p>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
