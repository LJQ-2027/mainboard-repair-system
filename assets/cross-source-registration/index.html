<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KM4/F151 跨资料主板工作台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./point-map.css">
  <link rel="stylesheet" href="./schematic-evidence.css">
</head>
<body>
  <header class="topbar">
    <div><span class="eyebrow">KNOWN BOARD / SOURCE-LINKED</span><h1>KM4 · F151_MAIN_PCB_V1.2</h1></div>
    <div class="status"><i></i>维修级 2.5D V2</div>
  </header>
  <main>
    <section class="workspace" aria-label="同步主板视图">
      <div class="view-head">
        <div class="tabs" role="tablist">
          <button role="tab" aria-selected="true" data-view="photo">主板实物参考</button>
          <button role="tab" aria-selected="false" data-view="pointmap">点位图</button>
          <button role="tab" aria-selected="false" data-view="model">2.5D 模型</button>
        </div>
        <div class="view-tools" id="pointMapTools" hidden>
          <button class="icon-button" id="zoomOutPointMap" title="缩小点位图" aria-label="缩小点位图">−</button>
          <button class="icon-button" id="zoomInPointMap" title="放大点位图" aria-label="放大点位图">+</button>
          <button class="icon-button" id="resetPointMap" title="重置点位图" aria-label="重置点位图">↻</button>
        </div>
      </div>
      <div class="stage">
        <div class="view active" id="photoView"><div class="image-layer"><img alt="KM4装机主板参考图"><div class="markers"></div></div></div>
        <div class="view point-map-view" id="pointmapView"><div class="image-layer point-map"><img alt="KM4 F151主板点位图"><div class="markers"></div></div></div>
        <div class="view model-view" id="modelView" aria-busy="false">
          <div id="modelCanvas"></div>
          <div class="view-tools" id="modelTools" hidden>
            <div class="model-interaction-modes" role="group" aria-label="模型拖拽模式">
              <button type="button" data-model-drag-mode="pan" aria-pressed="true">平移</button>
              <button type="button" data-model-drag-mode="rotate" aria-pressed="false">旋转</button>
            </div>
            <button class="model-angle-button" id="toggleInspection" type="button" aria-pressed="false" title="切换为斜视" aria-label="切换为斜视">斜视</button>
            <button class="icon-button" id="resetModel" type="button" title="显示全板并恢复俯视" aria-label="显示全板并恢复俯视">↻</button>
          </div>
          <div class="anatomy-panel" aria-label="模型解剖层控制">
            <div class="anatomy-segments" role="group" aria-label="屏蔽罩状态">
              <button type="button" data-shield-mode="installed" aria-pressed="false" title="显示安装状态的屏蔽罩">罩上</button>
              <button type="button" data-shield-mode="xray" aria-pressed="false" title="半透明查看屏蔽罩下器件">透视</button>
              <button type="button" data-shield-mode="removed" aria-pressed="true" title="移除屏蔽罩查看器件">拆罩</button>
            </div>
          </div>
          <div class="side-panel" aria-label="主板面切换">
            <div class="side-segments" role="group" aria-label="选择主板面">
              <button type="button" data-side-id="main_page_1" aria-pressed="false" aria-label="第1面"><span class="wide-side-prefix">第</span>1面</button>
              <button type="button" data-side-id="main_page_2" aria-pressed="true" aria-label="第2面"><span class="wide-side-prefix">第</span>2面</button>
            </div>
            <span id="activeSideLabel" aria-live="polite">第2面</span>
          </div>
          <button class="inspection-status" id="inspectionStatus" type="button" hidden aria-live="polite" title="返回主板">
            <span class="inspection-return-icon" aria-hidden="true">←</span><strong id="inspectionDesignator">U2001</strong><span>单体检视</span>
          </button>
        </div>
      </div>
      <div class="source-note" id="sourceNote"></div>
    </section>
    <aside class="evidence">
      <div class="entity-heading">
        <div><span id="entityCategory"></span><h2 id="entityDesignator">—</h2></div>
        <div class="entity-actions">
          <span class="visibility" id="entityVisibility"></span>
          <button class="inspect-component" id="inspectComponent" type="button" aria-pressed="false" disabled>单体查看</button>
        </div>
      </div>
      <p class="entity-name" id="entityName"></p>
      <dl class="facts"><div><dt>功能模块</dt><dd id="entityModule"></dd></div><div><dt>所在板面</dt><dd id="entitySide"></dd></div></dl>
      <section class="active-flow-return" id="activeFlowReturn" hidden aria-live="polite">
        <div><span>进行中的排查</span><strong id="activeFlowReturnTitle"></strong><small id="activeFlowReturnTarget"></small></div>
        <button id="resumeActiveFlow" type="button">返回流程</button>
      </section>
      <section class="component-guidance" id="componentGuidance" hidden>
        <header class="guidance-heading">
          <div><span>当前维修路径</span><h3>故障排查</h3></div>
          <strong id="guidanceProgress">0 / 1</strong>
        </header>
        <div class="guidance-group">
          <h4>故障现象</h4>
          <div class="fault-list" id="commonFaults" role="group" aria-label="选择故障现象"></div>
        </div>
        <section class="repair-flow-control" id="repairFlowControl" hidden>
          <header class="repair-flow-heading">
            <div><span>来源分支</span><strong id="repairFlowTitle"></strong></div>
            <div class="repair-flow-position"><strong id="repairFlowTarget"></strong><span id="repairFlowStep"></span></div>
          </header>
          <ol class="repair-flow-trail" id="repairFlowTrail" aria-label="维修步骤"></ol>
          <p class="repair-flow-prompt" id="repairFlowPrompt"></p>
          <div class="repair-flow-measurements" id="repairFlowMeasurements" hidden>
            <div id="repairFlowMeasurementFields"></div>
            <button id="repairFlowRecordMeasurements" type="button">记录本步测量</button>
            <p id="repairFlowMeasurementStatus"></p>
          </div>
          <div class="repair-flow-choices" id="repairFlowChoices" role="group" aria-label="选择检查结果"></div>
          <div class="repair-flow-terminal" id="repairFlowTerminal" hidden>
            <span id="repairFlowTerminalType"></span><strong id="repairFlowTerminalLabel"></strong>
            <p id="repairFlowBoundary"></p>
            <div class="repair-flow-action-record" id="repairFlowActionRecord" hidden>
              <button id="recordRepairFlowAction" type="button" aria-pressed="false">记录已执行</button>
              <p id="repairFlowActionStatus" aria-live="polite"></p>
              <fieldset class="repair-flow-recheck" id="repairFlowRecheck" hidden>
                <legend>执行后复检</legend>
                <div role="group" aria-label="记录执行后的故障现象">
                  <button type="button" data-post-action-check="symptom_cleared" aria-pressed="false">现象消失</button>
                  <button type="button" data-post-action-check="symptom_persists" aria-pressed="false">现象仍在</button>
                  <button type="button" data-post-action-check="uncertain" aria-pressed="false">无法确认</button>
                </div>
                <p id="repairFlowRecheckStatus" data-result="pending" aria-live="polite"></p>
              </fieldset>
            </div>
            <div class="repair-flow-completion" id="repairFlowCompletion" hidden>
              <button id="closeRepairFlow" type="button">结束本次排查</button>
              <p id="repairFlowCompletionStatus" aria-live="polite"></p>
            </div>
          </div>
          <div class="repair-flow-log" id="repairFlowLog" hidden>
            <span>已记录结果</span>
            <ol class="repair-flow-history" id="repairFlowHistory"></ol>
          </div>
          <footer>
            <details class="repair-flow-source-details"><summary>资料依据</summary><small id="repairFlowSource"></small></details>
            <div id="repairFlowNavigation"><button id="repairFlowBack" type="button">上一步</button><button id="repairFlowReset" type="button">重新开始</button></div>
          </footer>
        </section>
        <article class="repair-step source-summary">
          <header><span id="inspectionStepLabel">检测步骤 1</span><strong>来源检测指导</strong></header>
          <p id="inspectionMethod"></p>
          <small id="inspectionSource"></small>
        </article>
        <section class="measurement-control" id="measurementControl" hidden>
          <header><label for="guidanceMeasurementValue" id="measurementLabel">测量值</label><span id="measurementReference"></span></header>
          <div class="measurement-input-row">
            <input id="guidanceMeasurementValue" type="number" inputmode="decimal" required>
            <span id="measurementUnit"></span>
            <button id="recordMeasurement" type="button">记录</button>
          </div>
          <p id="measurementFeedback" data-evaluation="unrecorded"></p>
        </section>
        <fieldset class="result-control" id="resultControl">
          <legend>返回检测结果</legend>
          <div role="group" aria-label="选择本次检测结果">
            <button type="button" data-guidance-result="normal" aria-pressed="false">正常</button>
            <button type="button" data-guidance-result="abnormal" aria-pressed="false">异常</button>
            <button type="button" data-guidance-result="uncertain" aria-pressed="false">无法确认</button>
          </div>
        </fieldset>
        <p class="result-status" id="guidanceResultStatus" aria-live="polite"></p>
        <details class="model-boundary-details" id="modelBoundaryDetails">
          <summary>模型说明</summary><p id="modelBoundary"></p>
        </details>
      </section>
      <section><h3>原理图关系</h3><div id="schematicEvidence"></div></section>
      <section><h3>维修指导</h3><div id="repairEvidence"></div></section>
      <section class="entity-list-section"><h3 id="entityListHeading">第2面已关联实体</h3><div class="entity-list" id="entityList"></div></section>
    </aside>
  </main>
  <dialog class="evidence-dialog" id="evidenceDialog" aria-label="原理图局部证据">
    <button class="dialog-close" type="button" aria-label="关闭原理图预览">×</button>
    <img alt="原理图局部证据">
    <p></p>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
